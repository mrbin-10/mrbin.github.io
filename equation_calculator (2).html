<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연립방정식 계산기</title>
<style>
  :root { color-scheme: light; --ink:#17191f; --muted:#747985; --line:#e6e8ed; --accent:#2878d0; --panel:#f7f8fa; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f0f2f5; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { width:min(100%,560px); background:white; border:1px solid var(--line); border-radius:22px; padding:clamp(22px,5vw,38px); box-shadow:0 12px 40px #18243a12; }
  h1 { font-size:24px; margin:0 0 8px; letter-spacing:-.04em; }
  .sub { color:var(--muted); margin:0 0 28px; font-size:14px; }
  .equations { background:var(--panel); border-radius:14px; padding:18px 20px; font-family:Georgia,serif; font-size:clamp(20px,4vw,25px); line-height:1.9; text-align:center; margin-bottom:26px; }
  .controls { display:grid; gap:22px; }
  .control-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  label { font-weight:650; }
  output { font-size:20px; font-weight:750; color:var(--accent); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; }
  .bounds { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:3px; }
  .results { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:30px; }
  .result { background:#f4f8ff; border:1px solid #e1ecff; border-radius:14px; padding:18px; text-align:center; }
  .result span { display:block; color:var(--muted); font-size:13px; margin-bottom:7px; }
  .result strong { font-size:30px; color:#1767bd; font-variant-numeric:tabular-nums; }
  .reset { display:block; margin:22px auto 0; border:1px solid var(--line); background:white; border-radius:10px; padding:10px 18px; color:var(--ink); font-size:14px; cursor:pointer; }
  .reset:hover { background:var(--panel); }
  .note { margin:18px 0 0; color:var(--muted); font-size:12px; text-align:center; }
  @media (max-width:420px) { main { padding:22px 18px; } }
</style>
</head>
<body>
<main>
  <h1>연립방정식 계산기</h1>
  <p class="sub">서로의 패·필드 카드 수와 상대 몬스터의 레벨 또는 랭크를 입력하면 결과가 자동으로 계산됩니다.</p>
  <section class="equations" aria-label="계산식">
    2x + y = A<br>
    x + y = B
  </section>
  <section class="controls">
    <div>
      <div class="control-head"><label for="a">서로의 패와 필드의 카드 수</label><output id="aOut" for="a">14</output></div>
      <input id="a" type="range" min="0" max="20" step="1" value="14">
      <div class="bounds"><span>0</span><span>20</span></div>
    </div>
    <div>
      <div class="control-head"><label for="b">상대 몬스터의 레벨 또는 랭크</label><output id="bOut" for="b">8</output></div>
      <input id="b" type="range" min="0" max="20" step="1" value="8">
      <div class="bounds"><span>0</span><span>20</span></div>
    </div>
  </section>
  <section class="results" aria-live="polite">
    <div class="result"><span>x = A − B</span><strong id="xOut">6</strong></div>
    <div class="result"><span>y = 2B − A</span><strong id="yOut">2</strong></div>
  </section>
  <button class="reset" id="reset" type="button">초기화</button>
  <p class="note">계산식: x = A − B · y = 2B − A</p>
</main>
<script>
  const a = document.getElementById('a');
  const b = document.getElementById('b');
  const aOut = document.getElementById('aOut');
  const bOut = document.getElementById('bOut');
  const xOut = document.getElementById('xOut');
  const yOut = document.getElementById('yOut');
  function update() {
    const A = Number(a.value), B = Number(b.value);
    aOut.value = A; bOut.value = B;
    xOut.textContent = A - B;
    yOut.textContent = 2 * B - A;
  }
  a.addEventListener('input', update);
  b.addEventListener('input', update);
  document.getElementById('reset').addEventListener('click', () => {
    a.value = 0; b.value = 0; update();
  });
  update();
</script>
</body>
</html>
